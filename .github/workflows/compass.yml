name: Validate learning compass redesign
on:
  push:
    branches:
      - dev/compass-redesign-20261027
      - dev/evaluation-codes-20261027
      - dev/compass-principles-20261027
  workflow_dispatch:
jobs:
  compass:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Compile app
        run: python -m py_compile ai_preview_app.py compass_*.py sdl_upgrade/*.py
      - name: Test learning compass
        run: python -m unittest discover -s tests -p 'test_compass.py' -v
      - name: Test student-owned progress and feedback
        run: python -m unittest discover -s tests -p 'test_compass_progress.py' -v
      - name: Test existing learning strategy/diary core
        run: python -m unittest discover -s tests -p 'test_ai_upgrade.py' -v
      - name: Verify server health
        run: |
          streamlit run ai_preview_app.py --server.headless true --server.port 8501 > /tmp/compass.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/compass.log
          exit 1
